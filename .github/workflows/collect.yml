name: Collect Hot News

# 云端只做采集：抓 8 个热榜平台 → 累积当天的 SQLite → 传到 Release。
# 用 Release assets 而不是 git 分支，数据不占仓库体积，也不会让仓库越来越胖。
#
# 数据流向：
#   Release "data-{年份}" 的 assets（每天一个 db，永久保留）
#        ↓ gh release download（把当天那个取回来当基线）
#   runner 上继续累积（排名轨迹越长越完整）
#        ↓ gh release upload --clobber（同名文件覆盖更新，其他天的不动）
#
# 为什么按年分 release：官方限制是「每个 release 最多 1000 个 asset」（单文件 < 2GiB），
# 每天一个文件的话，不分类约 2.7 年就会撞上限。按年分 → 每年最多 365 个。
#
# 本机取数据：
#   gh release download data-2026 --dir output/news --clobber
#
# AI 筛选不在这里做（本机 wb2api 才是筛选题的地方）。
# 下面把 filter.method 改成 keyword，只是为了让云端不去尝试调用不存在的 AI 接口；
# trendradar 的采集层存全量、筛选层只影响 HTML 报告，所以 db 里的 news_items 永远是全部标题，
# 不会因为关键词/筛选而少掉任何一条（运行日志里的「自检」那一步就是在证明这件事）。

on:
  schedule:
    - cron: "33 * * * *"      # 每小时第 33 分钟
  workflow_dispatch:

permissions:
  contents: write             # 创建/更新 Release 需要写权限

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 取回当天的 db 基线
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          TAG="data-$(TZ=Asia/Shanghai date +%Y)"
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p output/news
          if gh release download "$TAG" --pattern "${TODAY}.db" --dir output/news --clobber 2>/dev/null; then
            echo "✅ 已从 $TAG 取回 ${TODAY}.db 作为基线，本次继续往上累积"
            ls -la output/news/
          else
            echo "ℹ️ $TAG 里还没有 ${TODAY}.db（今天第一次采集）"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: 关掉 AI 筛选与 HTML 报告（云端只采集）
        run: |
          sed -i 's/^  method: "ai"/  method: "keyword"/' config/config.yaml
          sed -i 's/^    html: true.*$/    html: false/' config/config.yaml
          grep -E '^  method:|^    html:' config/config.yaml

      - name: 采集
        env:
          PYTHONUTF8: "1"
        run: uv run python -m trendradar

      - name: 自检：db 里是全量数据（证明没被关键词/筛选剔掉过）
        run: |
          uv run python -c '
          import sqlite3, os
          db = "output/news/" + os.environ["TODAY"] + ".db"
          c = sqlite3.connect(db)
          total = c.execute("select count(*) from news_items").fetchone()[0]
          plats = c.execute("select platform_id, count(*) from news_items group by 1 order by 2 desc").fetchall()
          filtered = c.execute("select count(*) from ai_filter_results").fetchone()[0]
          analyzed = c.execute("select count(*) from ai_filter_analyzed_news").fetchone()[0]
          print(f"去重标题 {total} 条；筛选结果行数 {filtered}；已分析标记 {analyzed}（后两个应为 0）")
          print("平台分布:", dict(plats))
          assert filtered == 0 and analyzed == 0, "云端不应写入任何筛选结果"
          '

      - name: 上传快照到 Release
        run: |
          set -e
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "热榜快照 ${TAG#data-}" --latest=false \
              --notes "TrendRadar 每小时采集的 8 平台热榜快照，每天一个 db。"
          fi
          echo "本次上传 ${TODAY}.db 到 $TAG："
          ls -la "output/news/${TODAY}.db"
          gh release upload "$TAG" "output/news/${TODAY}.db" --clobber
          echo "── $TAG 现有快照 ──"
          gh release view "$TAG" --json assets -q '.assets[].name' | sort
