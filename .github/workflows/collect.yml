name: Collect Hot News

# 云端只做采集：抓 8 个热榜平台 → 累积当天的 SQLite → 推到 data 分支。
# AI 筛选不在这里做（本机 wb2api 才是筛选题的地方），所以这里把筛选关掉，纯采集。
#
# 数据流向：
#   data 分支的 output/news/*.db      ← 云端已保存的全部历史快照
#        ↓ 取回工作区，当天那份作为基线
#   跑一次采集（追加当天的排名轨迹）
#        ↓
#   推回 data 分支：当天已有 commit 就 amend 覆盖，跨天了就新增一个 commit
#   → 每天一个 commit，永久保留；git 历史可回溯，任何一次事故都能救回来
#
# 本机取数据：
#   git fetch origin data && git checkout origin/data -- output/news/

on:
  schedule:
    - cron: "33 * * * *"      # 每小时第 33 分钟
  workflow_dispatch:

permissions:
  contents: write             # 推 data 分支需要写权限

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 取回云端已保存的全部快照
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          if git fetch origin data --depth=1 2>/dev/null; then
            if git checkout origin/data -- output/news/ 2>/dev/null; then
              echo "✅ 云端已有 $(ls output/news | wc -l) 个快照，当天的那个作为基线继续累积："
              ls -la output/news/ | tail -5
            else
              echo "ℹ️ data 分支里没有 output/news/，从零开始"
            fi
          else
            echo "ℹ️ data 分支还不存在，从零开始"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: 关掉 AI 筛选与 HTML 报告（云端只采集）
        run: |
          sed -i 's/^  method: "ai"/  method: "keyword"/' config/config.yaml
          sed -i 's/^    html: true.*$/    html: false/' config/config.yaml
          grep -E '^  method:|^    html:' config/config.yaml

      - name: 采集
        env:
          PYTHONUTF8: "1"
        run: uv run python -m trendradar

      - name: 推送到 data 分支
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用 worktree 操作 data 分支，不打扰主工作区；历史快照全部带过去
          if git fetch origin data:data 2>/dev/null; then
            git worktree add /tmp/datawk data
            cd /tmp/datawk
            echo "云端已保存 $(ls output/news 2>/dev/null | wc -l) 个快照"
          else
            git worktree add --detach /tmp/datawk
            cd /tmp/datawk
            git checkout --orphan data
            git rm -rf --cached . > /dev/null 2>&1 || true
          fi

          mkdir -p output/news
          cp "$GITHUB_WORKSPACE"/output/news/*.db output/news/
          echo "本次将保存 $(ls output/news | wc -l) 个快照："
          ls -la output/news/

          # .gitignore 里忽略了 /output/，这里强制加入
          git add -f output/news

          # 当天已经提交过 → amend 覆盖（一天只留一个 commit）；跨天 → 新增 commit
          LAST_MSG=$(git log -1 --format=%s 2>/dev/null || echo "")
          if [ "$LAST_MSG" = "data: $TODAY" ]; then
            git commit --amend -m "data: $TODAY"
            echo "→ 已 amend 当天的 commit"
          else
            git commit -m "data: $TODAY"
            echo "→ 新增 commit（$LAST_MSG → data: $TODAY）"
          fi
          git push -f origin data
